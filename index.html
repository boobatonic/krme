<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Jacquard+24&display=swap" rel="stylesheet">

  <title>krme</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      font-size: 10pt;
      background-color: #f5f5f5;
      margin: 20px;
      color: #222;
    }

    header {
      font-family: "Jacquard 24", serif;
      font-size: 28px;
      text-align: center;
      margin-bottom: 40px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-bottom: 60px;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    img {
      max-width: 350px;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .texto {
      max-width: 400px;
      line-height: 1.5;
    }

    .texto h2 {
      font-family: "Jacquard 24", serif;
      font-size: 24px;
      margin-top: 0;
    }

    a {
      color: hotpink;
      text-decoration: none;
    }

    a:hover {
      color: cyan;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      color: gray;
    }

  </style>
</head>

<body>

  <header>
    <h1>krme</h1>
    <p>fotolibro</p>
  </header>

  <main>

    <div class="card">

      <img src="foto1.png" alt="foto 1">

      <div class="texto">
        <h2>foto 1</h2>

        <p>
          texto sobre la imagen.
          puedes escribir descripciones,
          poemas o links.
        </p>

        <p>
          <a href="https://instagram.com" target="_blank">
            ver más
          </a>
        </p>
      </div>

    </div>

    <div class="card">

      <img src="foto2.png" alt="foto 2">

      <div class="texto">
        <h2>foto 2</h2>

        <p>
          otro texto distinto para otra imagen.
        </p>

        <p>
          <a href="https://github.com" target="_blank">
            github
          </a>
        </p>
      </div>

    </div>

  </main>

  <footer>
    © bsas
  </footer>

</body>

</html>
