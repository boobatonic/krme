<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>krme</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jacquard+24&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: Roboto, sans-serif;
  background: #fbfbfb;
  color: #2c2c2c;
}

header {
  font-family: "Jacquard 24", serif;
  text-align: left;
  padding: 25px 50px;
  font-size: 30px;
  text-transform: lowercase;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 10px;
}

.post {
  background: #fbfbfb;
  margin-bottom: 60px;
  padding: 10px;

  display: flex;
  gap: 25px;
  align-items: flex-start;
}

img {
  order: 2;
  max-width: 450px;
  width: 100%;
  height: auto;
}

.text {
  order: 1;
  flex: 1;
  text-align: right;
}

.text h2 {
  font-family: Roboto, sans-serif;
  font-size: 10px;
  margin-top: 0;
  font-style: italic;
}

.text p {
  font-size: 9.5pt;
  line-height: 1.7;
  white-space: pre-line;
}

a {
  color: #000;
  text-decoration: none;
}

a:hover {
  color: #B7F719;
}

footer {
  text-align: right;
  padding: 40px;
  font-size: 7pt;
  color: #777;
}

</style>

</head>


<body>


<header>
  hola<br>
</header>


<div class="container" id="posts">

</div>


<footer>
© bsas
</footer>



<script>


// Agregás nuevos posts acá
const archivos = [
  "post_01.json",
  "post_02.json",
  "post_03.json"
];


const contenedor = document.getElementById("posts");


archivos.forEach(archivo => {


fetch("posts/post_01.json")
  
  .then(res => {

    if (!res.ok) {
      throw new Error("No se encontró " + archivo);
    }

    return res.json();

  })


  .then(post => {


    contenedor.innerHTML += `

    <div class="post">


      ${
        post.imagen
        ? `<img src="${post.imagen}" alt="">`
        : ""
      }


      <div class="text">


        <h2>
          ${post.fecha}
        </h2>


        <p>
          ${post.contenido}
        </p>


      </div>


    </div>

    `;


  })


  .catch(error => {

    console.error(error);

  });


});


</script>


</body>
</html>
