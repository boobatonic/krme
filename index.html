<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">

      color: #222;

      background-color: #222;

    img {
      width: 100%;
      height: auto;
      border-radius: 6px;

    }

    footer {

      padding: 15px;

      color: white;
      margin-top: 20px;
    }

</head>
