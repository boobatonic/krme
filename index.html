<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>krme</title>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jacquard+24&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fbfbfb;
      color: #2c2c2c;
    }

    /* HEADER */
    header {
      font-family: "Jacquard 24", serif;
      text-align: left;
      padding: 70px 20px;
      font-size: 25px;
      text-transform: lowercase;
    }

    /* CONTENEDOR */
    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    /* POST (tipo tumblr card) */
    .post {
      background: #f6f6f6;
      border: 1px solid #e3e3e3;
      margin-bottom: 60px;
      padding: 20px;
      border-radius: 6px;

      display: flex;
      gap: 25px;
      align-items: flex-start;
    }

    img {
      max-width: 350px;
      width: 100%;
      height: auto;
      border-radius: 4px;
    }

    .text {
      flex: 1;
    }

    .text h2 {
      font-family: "Jacquard 24", serif;
      font-size: 22px;
      margin-top: 0;
    }

    .text p {
      font-size: 10pt;
      line-height: 1.5;
    }

    a {
      color: #000;
      text-decoration: none;
    }

    a:hover {
      color: #545454;
    }

    footer {
      text-align: right;
      padding: 400px;
      font-size: 7pt;
      color: #777;
    }

  </style>
</head>

<body>

<header>
  krme<br>
  
</header>

<div class="container">

  <!-- POST 1 -->
  <div class="post">
    <img src="foto1.png" alt="foto 1">

    <div class="text">
      <h1>12 de mayo de 2026</h1
      <p>
un mujer mordiendo una computadora
      </p>

      <p>
        <a href="https://instagram.com" target="_blank">ver más</a>
      </p>
    </div>
  </div>

  <!-- POST 2 -->
  <div class="post">
    <img src="foto2.png" alt="foto 2">

    <div class="text">
      <h3>12/05/26</h3>
      <p>
        justin bieber.
      </p>
    </div>
  </div>

</div>

<footer>
  © bsas
</footer>

</body>
</html>
